{{/*
serviceaccount.yaml — Kubernetes identity for the copilot pod.

CONCEPT: SERVICEACCOUNT
═══════════════════════
In Kubernetes, a ServiceAccount is an identity for a Pod (not a human user).
When a Pod has a ServiceAccount assigned:
  1. K8s auto-mounts a token at /var/run/secrets/kubernetes.io/serviceaccount/token
  2. The Kubernetes API server uses this token to identify the pod
  3. RBAC rules bound to the ServiceAccount control what the pod can do

Without a ServiceAccount annotation, pods use the "default" ServiceAccount
in their namespace — which typically has no permissions. Best practice:
always create a dedicated ServiceAccount per workload with minimal permissions.

The kubernetes Python SDK's load_incluster_config() reads this mounted token
automatically. This is what allows our kube_api provider to talk to K8s
when running inside the cluster — no kubeconfig file needed.
*/}}

{{- if .Values.serviceAccount.create -}}
# {{- if ... -}} is a Helm conditional. Only renders this block when
# serviceAccount.create=true (the default). Set to false if you want
# to manage the ServiceAccount yourself outside of Helm.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-copilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-copilot.labels" . | nindent 4 }}
    # nindent 4: the labels block needs 4 spaces of indentation to be valid YAML.
    # include returns a string; nindent prepends N spaces to every line.
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  # {{- with .Values.x }}: only renders this block if .Values.x is non-empty.
  # toYaml: converts the Go map/slice to YAML string.
  # Common use for annotations: AWS IRSA (IAM roles for K8s), GCP Workload Identity.
  # e.g. serviceAccount.annotations:
  #        eks.amazonaws.com/role-arn: arn:aws:iam::123:role/my-role
  {{- end }}
{{- end }}
