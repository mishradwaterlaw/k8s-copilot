# ════════════════════════════════════════════════════════════════════════════
# .github/workflows/ci.yml — Continuous Integration Pipeline
# ════════════════════════════════════════════════════════════════════════════
#
# CONCEPT: GITHUB ACTIONS CI
# ══════════════════════════
# Continuous Integration (CI) is an automated pipeline that runs every time
# code is pushed or a Pull Request is opened. Its job is to catch bugs,
# lint violations, and build failures BEFORE bad code gets merged into `main`.
#
# PIPELINE STAGES:
#   1. Lint & Format check (Fast feedback)
#   2. Unit & Integration Tests (with pip caching for speed)
#   3. Docker Build Test (verifies Dockerfile compiles properly)
#   4. Helm Chart Linting (verifies Helm templates are valid syntax)
#
# INTERVIEW TALKING POINT:
#   "I created a comprehensive CI workflow with dependency caching via actions/cache.
#   It runs unit tests with mocked LLM calls, lints the codebase, validates the Helm chart,
#   and checks the multi-stage Docker build on every pull request to ensure zero broken builds."
# ════════════════════════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Set permissions for the GITHUB_TOKEN.
# Least privilege: read-only access to repository contents.
permissions:
  contents: read

jobs:
  # ── Job 1: Test & Lint ───────────────────────────────────────────────────────
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Cache pip dependencies to speed up subsequent CI runs
      # CONCEPT: ACTIONS/CACHE
      # Hash of requirements.txt is the cache key. If requirements haven't changed,
      # pip uses cached wheels instead of downloading them fresh from PyPI.
      # Reduces CI run time from ~2 minutes to ~20 seconds.
      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install core + dev dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock ruff

      # Step 5: Run linter check
      - name: Run Ruff Linter
        run: |
          # ruff checks for syntax errors, unused imports, and common bugs
          ruff check src/ tests/

      # Step 6: Run automated unit tests
      - name: Run Pytest with Mocked LLM Calls
        env:
          # Set dummy keys so unit tests don't require real credentials
          GOOGLE_API_KEY: "ci-mock-key"
          DATA_PROVIDER: "fixture"
        run: |
          pytest tests/ -v

  # ── Job 2: Helm Lint ────────────────────────────────────────────────────────
  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint (Default: Namespace-Scoped RBAC)
        run: |
          helm lint helm/k8s-copilot

      - name: Helm Template Verification (Validate Rendered Manifests)
        run: |
          # Render templates to make sure all Go template expressions evaluate cleanly
          helm template k8s-copilot ./helm/k8s-copilot \
            --set existingSecret=k8s-copilot-secrets \
            --namespace copilot-system

      - name: Helm Template Verification (Cluster-Wide RBAC Opt-In)
        run: |
          # Verify the cluster-wide branch of templates compiles without errors
          helm template k8s-copilot ./helm/k8s-copilot \
            --set existingSecret=k8s-copilot-secrets \
            --set rbac.clusterWide=true \
            --namespace copilot-system

  # ── Job 3: Docker Build Check ───────────────────────────────────────────────
  docker-check:
    name: Verify Dockerfile Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test] # Only run if tests pass

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # CONCEPT: CACHE-FROM & CACHE-TO
      # Docker Buildx GitHub Actions cache saves build layers between workflow runs.
      - name: Build Docker Image (Dry Run / Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Do not push on PR/CI (only validate that it builds successfully)
          tags: ghcr.io/mishradwaterlaw/k8s-copilot:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
